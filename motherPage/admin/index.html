<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>신청 관리 — 설다연</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <!-- notice.css only defines scoped classes (.ot_*/.man_*, no bare
         element selectors), so it's safe to load site-wide here — it's
         what lets the rich-text editor preview section headers/callouts/
         numbered steps/photos exactly as they'll look on the public page.
         It expects a few custom properties from common.css that this page
         doesn't otherwise load; those are re-declared scoped to .rte below
         instead of pulling in all of common.css (which *does* have broad
         resets that would fight this page's own .adm-* design). -->
    <link rel="stylesheet" href="../notice/notice.css">
    <script src="../events/events-data.js"></script>
    <script src="../join/join-config.js"></script>
    <script src="../content-config.js"></script>
    <script src="../content-api.js"></script>
    <script src="rich-editor.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green:      #1c6655;
            --green-pale: #e8f0ee;
            --green-mid:  rgba(28,102,85,.15);
            --amber:      #7a6300;
            --amber-pale: #fef9e7;
            --red:        #b23b3b;
            --red-pale:   rgba(178,59,59,.09);
            --gray:       #666;
            --border:     #e0e0dd;
            --radius:     6px;
            --font:       "Pretendard Variable", -apple-system, "Noto Sans KR", sans-serif;
        }

        body {
            font-family: var(--font);
            font-size: 14px;
            color: #222;
            background: #f5f5f3;
            min-height: 100vh;
        }

        /* ── header ── */
        .adm-header {
            background: var(--green);
            color: #fff;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .adm-header h1 { font-size: 16px; font-weight: 700; }
        .adm-header-sub { font-size: 12px; opacity: .65; }
        .adm-header-spacer { flex: 1; }
        .adm-last-fetch {
            font-size: 11.5px;
            opacity: .75;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .adm-pulse {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #7dffcc;
            opacity: 0;
        }
        .adm-pulse.on { animation: pulse 1.2s ease-out forwards; }
        @keyframes pulse {
            0%   { opacity: 1; transform: scale(1); }
            70%  { opacity: .6; transform: scale(1.5); }
            100% { opacity: 0; transform: scale(1); }
        }

        /* ── tabs ── */
        .adm-tabs {
            background: #fff;
            border-bottom: 1px solid var(--border);
            display: flex;
            padding: 0 32px;
        }
        .adm-tab {
            padding: 13px 18px;
            font-family: var(--font);
            font-size: 13.5px;
            font-weight: 600;
            color: var(--gray);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            margin-bottom: -1px;
            transition: color .15s, border-color .15s;
        }
        .adm-tab:hover { color: #444; }
        .adm-tab.is-active { color: var(--green); border-bottom-color: var(--green); }

        /* ── layout ── */
        .adm-wrap { max-width: 1120px; margin: 0 auto; padding: 28px 24px 60px; }
        .adm-panel { display: none; }
        .adm-panel.is-active { display: block; }

        /* ── query bar ── */
        .adm-field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 180px; }
        .adm-field label { font-size: 11px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: .05em; }
        .adm-pw {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 14px;
            color: #222;
            background: #fff;
            outline: none;
            transition: border-color .15s;
        }
        .adm-pw:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(28,102,85,.1); }
        .adm-btn {
            padding: 9px 22px;
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity .15s;
        }
        .adm-btn:hover { opacity: .88; }
        .adm-btn:disabled { opacity: .45; cursor: not-allowed; }
        .adm-btn-sm {
            padding: 6px 14px;
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity .15s;
        }
        .adm-btn-sm:hover { opacity: .88; }
        .adm-btn-sm:disabled { opacity: .45; cursor: not-allowed; }

        .adm-btn-sec {
            padding: 7px 16px;
            background: #fff;
            color: var(--green);
            border: 1px solid var(--green);
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s;
        }
        .adm-btn-sec:hover { background: var(--green-pale); }

        /* ── status text ── */
        .adm-status {
            font-size: 13px;
            color: var(--gray);
            margin-bottom: 14px;
            min-height: 18px;
        }
        .adm-status.err { color: var(--red); }
        .adm-empty { text-align: center; padding: 56px; color: var(--gray); font-size: 14px; }

        /* ── 소모임 panel ── */
        .sm-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .sm-toolbar-spacer { flex: 1; }
        .sm-last-upd {
            font-size: 12px;
            color: var(--gray);
        }
        .sm-filter-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--gray);
            cursor: pointer;
            user-select: none;
        }
        .sm-filter-toggle input { accent-color: var(--green); cursor: pointer; }

        /* ── 소모임 cards ── */
        .sm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .sm-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .sm-card-body { padding: 16px 18px 14px; }
        .sm-card-date {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 4px;
        }
        .sm-card-title {
            font-size: 15px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 3px;
            line-height: 1.35;
        }
        .sm-card-host {
            font-size: 12px;
            color: var(--gray);
            margin-bottom: 12px;
        }

        /* cap row inside card */
        .sm-cap-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .sm-cap-track {
            flex: 1;
            height: 6px;
            background: #eee;
            border-radius: 999px;
            overflow: hidden;
        }
        .sm-cap-fill {
            height: 100%;
            border-radius: 999px;
            background: var(--green);
        }
        .sm-cap-fill.is-full { background: var(--red); }
        .sm-cap-cnt {
            font-size: 12px;
            font-weight: 700;
            color: #555;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .sm-cap-cnt.is-full { color: var(--red); }
        .sm-full-pill {
            font-size: 11px;
            font-weight: 700;
            background: var(--red-pale);
            color: var(--red);
            padding: 2px 7px;
            border-radius: 10px;
        }
        /* pending-approval controls on unapproved 소모임 cards */
        .sm-pending-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 0 0 12px;
            padding: 10px 12px;
            background: rgba(226, 168, 68, 0.10);
            border: 1px solid rgba(226, 168, 68, 0.32);
            border-radius: 8px;
            color: #7a4f10;
            font-size: 12.5px;
        }
        .sm-pending-banner b { font-weight: 700; }
        .sm-approve-btn {
            padding: 6px 12px;
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .sm-approve-btn:hover { opacity: .88; }
        .sm-approve-btn:disabled { opacity: .5; cursor: not-allowed; }
        .sm-approve-err {
            margin: 6px 0 0;
            font-size: 11.5px;
            color: var(--red);
        }

        /* participant chips */
        .sm-names {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 12px;
            min-height: 24px;
        }
        .sm-name-chip {
            display: inline-block;
            padding: 3px 9px;
            background: var(--green-pale);
            color: var(--green);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        .sm-name-chip.is-host {
            background: var(--green-mid);
            color: var(--green);
        }
        .sm-host-mark {
            font-size: 9.5px;
            opacity: .7;
            margin-left: 3px;
        }
        .sm-names-empty {
            font-size: 12px;
            color: #bbb;
            font-style: italic;
            line-height: 2;
        }

        /* detail panel (real names) */
        .sm-detail-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            padding: 10px 18px;
            background: #f8f8f6;
            border: none;
            border-top: 1px solid var(--border);
            font-family: var(--font);
            font-size: 12.5px;
            font-weight: 600;
            color: var(--gray);
            cursor: pointer;
            text-align: left;
            transition: background .12s, color .12s;
        }
        .sm-detail-toggle:hover { background: var(--green-pale); color: var(--green); }
        .sm-detail-toggle.is-open { color: var(--green); background: var(--green-pale); }
        .sm-detail-toggle-arrow { margin-left: auto; font-size: 11px; transition: transform .2s; }
        .sm-detail-toggle.is-open .sm-detail-toggle-arrow { transform: rotate(180deg); }

        .sm-detail-panel {
            display: none;
            padding: 14px 18px;
            border-top: 1px solid var(--border);
            background: #fafaf8;
        }
        .sm-detail-panel.is-open { display: block; }

        .sm-detail-pw-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }
        .sm-detail-pw-row input {
            flex: 1;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 13px;
            outline: none;
            transition: border-color .15s;
        }
        .sm-detail-pw-row input:focus { border-color: var(--green); }
        .sm-detail-err {
            font-size: 12px;
            color: var(--red);
            margin-bottom: 8px;
        }

        /* real-name table inside detail */
        .sm-detail-table-wrap { overflow-x: auto; }
        .sm-detail-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
        }
        .sm-detail-table th {
            padding: 6px 10px;
            background: #f0f0ee;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--gray);
            text-align: left;
            white-space: nowrap;
        }
        .sm-detail-table td {
            padding: 7px 10px;
            border-bottom: 1px solid #f0f0ee;
            color: #333;
            vertical-align: middle;
        }
        .sm-detail-table tr:last-child td { border-bottom: none; }
        .sm-detail-table .is-host-row td { background: rgba(28,102,85,.04); }
        .sm-detail-table .is-canceled-row td { color: #bbb; }
        .sm-detail-table .is-canceled-row td:nth-child(2) { text-decoration: line-through; }
        .sm-host-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            background: var(--green-pale);
            color: var(--green);
            padding: 1px 5px;
            border-radius: 6px;
            margin-left: 4px;
        }
        .sm-cancel-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            background: #fee2e2;
            color: #dc2626;
            padding: 1px 5px;
            border-radius: 6px;
            margin-left: 4px;
            text-decoration: none;
        }
        .sm-delete-row {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(0,0,0,0.1);
            display: flex;
            justify-content: flex-end;
        }
        .adm-btn-danger {
            padding: 5px 14px;
            border: 1px solid #dc2626;
            border-radius: 6px;
            background: none;
            color: #dc2626;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }
        .adm-btn-danger:hover { background: #fee2e2; }

        /* section heading for past events */
        .sm-section-head {
            font-size: 11px;
            font-weight: 700;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: .07em;
            margin-bottom: 12px;
            margin-top: 8px;
        }
        .sm-past-toggle {
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 13px;
            color: var(--gray);
            padding: 8px 18px;
            cursor: pointer;
            display: block;
            width: 100%;
            text-align: center;
            margin-bottom: 16px;
            transition: background .12s;
        }
        .sm-past-toggle:hover { background: #eee; }

        /* ── 소모임 이력 ── */
        .hist-auth {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 22px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            margin-bottom: 20px;
        }
        .hist-event-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 12px;
            overflow: hidden;
        }
        .hist-card-head {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
        }
        .hist-card-date {
            font-size: 12px;
            color: var(--gray);
            margin-bottom: 3px;
        }
        .hist-card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 3px;
        }
        .hist-card-host {
            font-size: 12.5px;
            color: var(--gray);
            margin-bottom: 8px;
        }
        .hist-card-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .hist-chip {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 100px;
            background: var(--green-pale);
            color: var(--green);
        }
        .hist-chip.deleted {
            background: var(--red-pale);
            color: var(--red);
        }
        .hist-event-card.is-deleted {
            border-color: rgba(178, 59, 59, 0.28);
            background: rgba(178, 59, 59, 0.02);
        }
        .hist-event-card.is-deleted .hist-card-title {
            text-decoration: line-through;
            color: var(--gray);
        }
        .hist-chip.canceled {
            background: var(--red-pale);
            color: var(--red);
        }
        .hist-table-wrap { overflow-x: auto; }
        .hist-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .hist-table th,
        .hist-table td {
            padding: 8px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .hist-table th {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--gray);
            background: #fafaf9;
        }
        .hist-row-host { background: var(--green-pale); }
        .hist-row-canceled { opacity: .6; }
        .hist-row-canceled td { text-decoration: line-through; }
        .hist-badge-host {
            background: var(--green); color: #fff;
            font-size: 10px; font-weight: 700;
            padding: 1px 6px; border-radius: 100px;
            margin-left: 4px; text-decoration: none; display: inline-block;
        }
        .hist-badge-canceled {
            background: var(--red); color: #fff;
            font-size: 10px; font-weight: 700;
            padding: 1px 6px; border-radius: 100px;
            margin-left: 4px; text-decoration: none; display: inline-block;
        }
        .hist-empty-card {
            font-size: 12px; color: #aaa;
            padding: 12px 18px;
        }
        .hist-no-events {
            text-align: center;
            padding: 48px;
            color: var(--gray);
            font-size: 13px;
        }

        @media (max-width: 640px) {
            .adm-header { padding: 14px 16px; }
            .adm-tabs   { padding: 0 16px; }
            .adm-wrap   { padding: 16px 12px 40px; }
            .sm-grid { grid-template-columns: 1fr; }
            .hist-auth { flex-direction: column; align-items: stretch; }
        }

        /* ── admin lock overlay ──────────────────────────────────────────
           Full-screen gate rendered above everything else. The rest of the
           page is invisible/inert until the admin password verifies against
           the backend (via the existing adminListAll action, which rejects
           the wrong password). A successful unlock stashes the password in
           sessionStorage so within a single tab session the user isn't
           re-prompted on refresh. sessionStorage (not localStorage) is a
           deliberate call so a closed tab always re-locks.
           Layered above modals via z-index. */
        .adm-lock {
            position: fixed;
            inset: 0;
            z-index: 9000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(240, 240, 236, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .adm-lock[hidden] { display: none; }
        .adm-lock-card {
            width: 100%;
            max-width: 380px;
            padding: 30px 28px 26px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.14);
            border: 1px solid rgba(0, 0, 0, 0.06);
        }
        .adm-lock-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            background: rgba(28, 102, 85, 0.10);
            border-radius: 50%;
            color: var(--green);
        }
        .adm-lock-icon svg { width: 22px; height: 22px; }
        .adm-lock-title {
            margin: 0 0 6px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            color: #222;
        }
        .adm-lock-sub {
            margin: 0 0 20px;
            font-size: 12.5px;
            text-align: center;
            color: var(--gray);
            line-height: 1.55;
        }
        .adm-lock-input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid rgba(0, 0, 0, 0.14);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .adm-lock-input:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(28, 102, 85, 0.12);
        }
        .adm-lock-input.is-error {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(178, 59, 59, 0.10);
        }
        .adm-lock-btn {
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .adm-lock-btn:hover { opacity: .88; }
        .adm-lock-btn:disabled { opacity: .5; cursor: not-allowed; }
        .adm-lock-err {
            margin: 10px 0 0;
            font-size: 12.5px;
            color: var(--red);
            min-height: 1.1em;
        }
        /* small button in the header for stepping away from the machine */
        .adm-lock-relock {
            margin-left: 12px;
            padding: 6px 12px;
            background: transparent;
            color: var(--gray);
            border: 1px solid rgba(0, 0, 0, 0.14);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .adm-lock-relock:hover { color: var(--red); border-color: var(--red); }

        /* ── 공지사항 / 정보 panels (content admin) ──
           Reuses the same card-grid recipe as .sm-grid/.sm-card above,
           renamed .cnt-* since these two tabs share one grid/card/modal
           set (parameterized by JS — see wireContentAdmin()). */
        .cnt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        .cnt-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
        }
        .cnt-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }
        .cnt-pin-badge {
            flex-shrink: 0;
            font-size: 10.5px;
            font-weight: 700;
            background: var(--green-pale);
            color: var(--green);
            padding: 2px 8px;
            border-radius: 10px;
        }
        .cnt-card-date {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 4px;
        }
        .cnt-card-title {
            font-size: 15px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.35;
            margin-bottom: 6px;
        }
        .cnt-card-excerpt {
            font-size: 12.5px;
            color: var(--gray);
            line-height: 1.55;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .cnt-card-actions {
            display: flex;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px dashed rgba(0,0,0,0.1);
        }

        /* ── shared create/edit modal (notices, info — and events later) ── */
        .cnt-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 50;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 16px;
            overflow-y: auto;
        }
        .cnt-modal-overlay.is-open { display: flex; }
        .cnt-modal {
            width: 100%;
            max-width: 640px;
            background: #fff;
            border-radius: 10px;
            padding: 28px 28px 24px;
            position: relative;
        }
        /* 정기다회 modal has enough extra fields (location/coords/hero photo/
           repeatable tea list) to want more breathing room than the
           notices/info modal */
        .cnt-modal-wide { max-width: 760px; }
        .cnt-modal-close {
            position: absolute;
            top: 16px; right: 16px;
            width: 30px; height: 30px;
            border: none;
            background: none;
            font-size: 20px;
            line-height: 1;
            color: var(--gray);
            cursor: pointer;
            border-radius: 50%;
        }
        .cnt-modal-close:hover { background: #f0f0ee; }
        .cnt-modal-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .cnt-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
        .cnt-field label {
            font-size: 11px;
            font-weight: 700;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: .05em;
        }
        .cnt-field input[type="text"],
        .cnt-field input[type="date"],
        .cnt-field textarea {
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 14px;
            color: #222;
            resize: vertical;
        }
        .cnt-field input:focus,
        .cnt-field textarea:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(28,102,85,.1);
        }
        .cnt-field-row {
            display: flex;
            gap: 14px;
            align-items: flex-end;
        }
        .cnt-field-row .cnt-field { flex: 1; margin-bottom: 0; }
        .cnt-field-row-3 { display: flex; gap: 12px; margin-bottom: 14px; }
        .cnt-field-row-3 .cnt-field { flex: 1; margin-bottom: 0; min-width: 0; }
        .cnt-field select {
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 14px;
            color: #222;
            background: #fff;
        }
        .cnt-field select:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(28,102,85,.1);
        }

        /* status line under 장소/길찾기 링크 showing the auto-geocode result
           (see geocodeAddress() — only resolves on the deployed origin,
           the NCP key is domain-whitelisted) */
        .evt-geo-status {
            font-size: 12px;
            color: var(--gray);
            margin: -6px 0 14px;
        }
        .evt-geo-status.is-ok { color: var(--green); }
        .evt-geo-status.is-err { color: var(--red); }

        /* ── image upload row (event hero photo + per-tea photo) ── */
        .evt-img-upload { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .evt-img-thumb {
            width: 72px; height: 54px;
            border-radius: 6px;
            object-fit: cover;
            background: #f3f3f1;
            border: 1px solid var(--border);
        }

        /* ── repeatable tea sections ── */
        .evt-tea-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 10px; }
        .evt-tea-card {
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 14px 16px 4px;
            background: #fbfbfa;
        }
        .evt-tea-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .evt-tea-num { font-size: 12px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .05em; }

        /* maps to the hexagon/radar chart events/view.html draws from these
           six 0–5 values (see FLAVOR_AXES / renderFlavorChart) */
        .evt-flavor-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .evt-flavor-item { display: flex; flex-direction: column; gap: 4px; }
        .evt-flavor-item label {
            font-size: 11px;
            font-weight: 700;
            color: var(--gray);
        }
        .evt-flavor-item input {
            width: 100%;
            padding: 7px 9px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 13px;
            color: #222;
        }
        .evt-flavor-item input:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(28,102,85,.1);
        }
        .cnt-pin-check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            padding-bottom: 9px;
            cursor: pointer;
            white-space: nowrap;
        }
        .cnt-pin-check input { accent-color: var(--green); cursor: pointer; }
        .cnt-form-error {
            font-size: 12.5px;
            color: var(--red);
            margin: 4px 0 10px;
        }
        .cnt-form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }
        .cnt-btn-secondary {
            padding: 9px 18px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 13.5px;
            font-weight: 600;
            color: #444;
            cursor: pointer;
        }
        .cnt-btn-secondary:hover { background: #f5f5f3; }

        /* ── rich-text editor (rich-editor.js) ──
           Re-declares the notice.css custom properties this page doesn't
           otherwise load (see the <link> comment in <head>), scoped to
           .rte so the ot_ and man_ prefixed blocks the "insert block"
           buttons drop in preview with their real site colors/spacing,
           without affecting anything else on this page. */
        .rte {
            --osullocGreen: #1c6655;
            --osullocGreenV: #018275;
            --osullocGreenS: #ccdcca;
            --fontColor: #000000;
            --fontGray: rgba(0, 0, 0, 0.6);
            --font-weight-semibold: 500;
            --font-weight-bold: 700;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .rte_toolbar {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 6px;
            background: #f8f8f6;
            border-bottom: 1px solid var(--border);
        }
        .rte_btn {
            width: 28px; height: 28px;
            border: none;
            background: transparent;
            border-radius: 5px;
            font-family: var(--font);
            font-size: 13px;
            color: #444;
            cursor: pointer;
        }
        .rte_btn:hover { background: #eaeae7; }
        .rte_btn:disabled { opacity: .5; cursor: not-allowed; }
        /* "insert block" buttons (섹션/느낌표/번호 목록/이미지) — a warm
           tint sets them apart from the plain inline-formatting buttons */
        .rte_btn_block {
            background: rgba(226, 168, 68, 0.12);
            color: #8a6d1d;
        }
        .rte_btn_block:hover { background: rgba(226, 168, 68, 0.24); }
        .rte_divider {
            width: 1px;
            align-self: stretch;
            margin: 2px 4px;
            background: var(--border);
        }
        .rte_area {
            min-height: 120px;
            max-height: 420px;
            overflow-y: auto;
            padding: 10px 12px;
            font-size: 14px;
            line-height: 1.65;
            color: #222;
        }
        .rte_area:focus { outline: none; }
        .rte_area p { margin: 0 0 10px; }
        .rte_area h4 { font-size: 15px; font-weight: 700; margin: 14px 0 6px; }
        .rte_area ul { margin: 0 0 10px 20px; }
        .rte_area a { color: var(--green); }
        /* the inserted blocks carry their own margins from notice.css
           (tuned for a full page); trim the excess so they don't look
           oddly spaced inside this much smaller editor box */
        .rte_area .ot_section_head { margin: 18px 0 14px; }
        .rte_area .ot_section_head:first-child { margin-top: 0; }
        .rte_area .man_steps { margin: 0; }
        .rte_area .cnt_figure { margin: 12px auto 18px; max-width: 320px; }
    </style>
</head>
<body>

<!-- password gate — hidden after adminListAll accepts the entered password.
     Rendered first (and z-indexed above modals) so the page under it stays
     invisible until the gate opens. -->
<div class="adm-lock" id="adm-lock">
    <div class="adm-lock-card">
        <div class="adm-lock-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="10" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8 10V7a4 4 0 118 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
        </div>
        <p class="adm-lock-title">관리자 페이지</p>
        <p class="adm-lock-sub">이 페이지는 설다연 임원진 전용입니다.<br>관리자 비밀번호를 입력해주세요.</p>
        <form id="adm-lock-form" autocomplete="off">
            <input class="adm-lock-input" id="adm-lock-input" type="password"
                   placeholder="비밀번호 입력" autocomplete="current-password" required autofocus>
            <button class="adm-lock-btn" id="adm-lock-btn" type="submit">확인</button>
            <p class="adm-lock-err" id="adm-lock-err"></p>
        </form>
    </div>
</div>

<header class="adm-header">
    <h1>신청 관리</h1>
    <span class="adm-header-sub">설다연 행사</span>
    <div class="adm-header-spacer"></div>
    <button class="adm-lock-relock" id="adm-relock-btn" type="button" hidden>잠금</button>
    <div class="adm-last-fetch" id="adm-last-fetch" hidden>
        <span class="adm-pulse" id="adm-pulse"></span>
        <span id="adm-last-fetch-text"></span>
    </div>
</header>

<nav class="adm-tabs">
    <button class="adm-tab is-active" data-panel="tab-somori">소모임</button>
    <button class="adm-tab"           data-panel="tab-history">소모임 이력</button>
    <button class="adm-tab"           data-panel="tab-notices">공지사항</button>
    <button class="adm-tab"           data-panel="tab-info">정보</button>
    <button class="adm-tab"           data-panel="tab-events">정기다회</button>
</nav>

<div class="adm-wrap">

    <!-- ══ 소모임 panel ═════════════════════════════════════════════════ -->
    <div class="adm-panel" id="tab-somori">

        <div class="sm-toolbar">
            <button class="adm-btn-sec" id="sm-refresh-btn">새로고침</button>
            <label class="sm-filter-toggle">
                <input type="checkbox" id="sm-show-past">
                지난 소모임 포함
            </label>
            <div class="sm-toolbar-spacer"></div>
            <span class="sm-last-upd" id="sm-last-upd"></span>
        </div>

        <p class="adm-status" id="sm-status"></p>

        <!-- upcoming events -->
        <div id="sm-upcoming-wrap">
            <p class="sm-section-head" id="sm-upcoming-label" hidden>예정 소모임</p>
            <div class="sm-grid" id="sm-upcoming-grid"></div>
        </div>

        <!-- past events (shown only when checkbox is checked) -->
        <div id="sm-past-wrap" hidden>
            <p class="sm-section-head">지난 소모임</p>
            <div class="sm-grid" id="sm-past-grid"></div>
        </div>

    </div><!-- /tab-somori -->

    <!-- ══ 소모임 이력 panel ══════════════════════════════════════════════ -->
    <div class="adm-panel" id="tab-history">

        <div class="hist-auth">
            <div class="adm-field" style="max-width:220px;">
                <label for="hist-pw">관리자 비밀번호</label>
                <input class="adm-pw" id="hist-pw" type="password" placeholder="비밀번호 입력" autocomplete="current-password">
            </div>
            <button class="adm-btn" id="hist-fetch-btn">조회</button>
        </div>

        <p class="adm-status" id="hist-status"></p>
        <div id="hist-list"></div>

    </div><!-- /tab-history -->

    <!-- ══ 공지사항 panel ═══════════════════════════════════════════════ -->
    <div class="adm-panel" id="tab-notices">
        <div class="sm-toolbar">
            <button class="adm-btn-sec" id="ntc-refresh-btn">새로고침</button>
            <div class="sm-toolbar-spacer"></div>
            <button class="adm-btn" id="ntc-new-btn">+ 새 공지 작성</button>
        </div>
        <p class="adm-status" id="ntc-status"></p>
        <div class="cnt-grid" id="ntc-grid"></div>
    </div><!-- /tab-notices -->

    <!-- ══ 정보 panel ═══════════════════════════════════════════════════ -->
    <div class="adm-panel" id="tab-info">
        <div class="sm-toolbar">
            <button class="adm-btn-sec" id="inf-refresh-btn">새로고침</button>
            <div class="sm-toolbar-spacer"></div>
            <button class="adm-btn" id="inf-new-btn">+ 새 정보 글 작성</button>
        </div>
        <p class="adm-status" id="inf-status"></p>
        <div class="cnt-grid" id="inf-grid"></div>
    </div><!-- /tab-info -->

    <!-- ══ 정기다회 panel ═══════════════════════════════════════════════ -->
    <div class="adm-panel" id="tab-events">
        <div class="sm-toolbar">
            <button class="adm-btn-sec" id="evt-refresh-btn">새로고침</button>
            <div class="sm-toolbar-spacer"></div>
            <button class="adm-btn" id="evt-new-btn">+ 새 다회 작성</button>
        </div>
        <p class="adm-status" id="evt-status"></p>
        <div class="cnt-grid" id="evt-grid"></div>
    </div><!-- /tab-events -->

</div><!-- /adm-wrap -->

<!-- ══ 공지사항/정보 create·edit modal (shared — see wireContentAdmin()) ══ -->
<div class="cnt-modal-overlay" id="cnt-modal-overlay">
    <div class="cnt-modal">
        <button type="button" class="cnt-modal-close" id="cnt-modal-close" aria-label="닫기">&times;</button>
        <h3 class="cnt-modal-title" id="cnt-modal-title">새 글 작성</h3>
        <form id="cnt-form">
            <div class="cnt-field">
                <label for="cnt-title">제목 *</label>
                <input type="text" id="cnt-title" required maxlength="120">
            </div>
            <div class="cnt-field">
                <label for="cnt-title-en">영문 제목 (선택)</label>
                <input type="text" id="cnt-title-en" maxlength="160">
            </div>
            <div class="cnt-field-row">
                <div class="cnt-field">
                    <label for="cnt-date">날짜 *</label>
                    <input type="date" id="cnt-date" required>
                </div>
                <label class="cnt-pin-check">
                    <input type="checkbox" id="cnt-pinned">
                    상단 고정
                </label>
            </div>
            <div class="cnt-field">
                <label for="cnt-excerpt">미리보기 문구 (선택)</label>
                <textarea id="cnt-excerpt" rows="2" maxlength="200"></textarea>
            </div>
            <div class="cnt-field">
                <label for="cnt-excerpt-en">영문 미리보기 (선택)</label>
                <textarea id="cnt-excerpt-en" rows="2" maxlength="240"></textarea>
            </div>
            <div class="cnt-field">
                <label>본문</label>
                <div id="cnt-body-editor"></div>
            </div>
            <div class="cnt-field">
                <label>영문 본문 (선택)</label>
                <div id="cnt-body-editor-en"></div>
            </div>
            <p class="cnt-form-error" id="cnt-form-error" hidden></p>
            <div class="cnt-form-actions">
                <button type="button" class="cnt-btn-secondary" id="cnt-cancel-btn">취소</button>
                <button type="submit" class="adm-btn" id="cnt-save-btn">저장</button>
            </div>
        </form>
    </div>
</div>

<!-- ══ 정기다회 create·edit modal — separate from #cnt-modal-overlay above:
     events have enough extra fields (location/fee/hero photo/repeatable tea
     sections) that reusing the notices/info modal would mean branching most
     of its logic, so this is its own small self-contained form instead,
     just reusing the same .cnt-modal/.cnt-field visual language. ══ -->
<div class="cnt-modal-overlay" id="evt-modal-overlay">
    <div class="cnt-modal cnt-modal-wide">
        <button type="button" class="cnt-modal-close" id="evt-modal-close" aria-label="닫기">&times;</button>
        <h3 class="cnt-modal-title" id="evt-modal-title">새 다회 작성</h3>
        <form id="evt-form">
            <div class="cnt-field">
                <label for="evt-title">제목 *</label>
                <input type="text" id="evt-title" required maxlength="120">
            </div>
            <div class="cnt-field">
                <label for="evt-title-en">영문 제목 (선택)</label>
                <input type="text" id="evt-title-en" maxlength="160">
            </div>
            <div class="cnt-field-row">
                <div class="cnt-field">
                    <label for="evt-date">날짜 *</label>
                    <input type="date" id="evt-date" required>
                </div>
                <div class="cnt-field">
                    <label for="evt-time">시간 *</label>
                    <input type="text" id="evt-time" placeholder="18:00" maxlength="30" required>
                </div>
            </div>
            <div class="cnt-field">
                <label for="evt-category">구분</label>
                <select id="evt-category">
                    <option value="regulars">정기다회</option>
                    <option value="specialTea">특별다회</option>
                </select>
            </div>
            <div class="cnt-field">
                <label for="evt-venue-name">장소 이름 *</label>
                <input type="text" id="evt-venue-name" maxlength="80" placeholder="예: 반조, 티앤커피토브 — 방문자에게 이렇게 보여요" required>
            </div>
            <div class="cnt-field-row">
                <div class="cnt-field">
                    <label for="evt-location">주소 (좌표 검색용, 비공개, 선택)</label>
                    <input type="text" id="evt-location" maxlength="160" placeholder="주소를 입력하면 좌표를 자동으로 찾아요">
                </div>
                <div class="cnt-field">
                    <label for="evt-map-link">길찾기 링크 (선택)</label>
                    <input type="text" id="evt-map-link" maxlength="300" placeholder="https://naver.me/...">
                </div>
            </div>
            <p class="evt-geo-status" id="evt-geo-status" hidden></p>
            <div class="cnt-field-row">
                <div class="cnt-field">
                    <label for="evt-lat">위도 (자동/선택)</label>
                    <input type="text" id="evt-lat" inputmode="decimal" maxlength="20">
                </div>
                <div class="cnt-field">
                    <label for="evt-lng">경도 (자동/선택)</label>
                    <input type="text" id="evt-lng" inputmode="decimal" maxlength="20">
                </div>
            </div>
            <div class="cnt-field-row">
                <div class="cnt-field">
                    <label for="evt-capacity">인원 *</label>
                    <input type="text" id="evt-capacity" inputmode="numeric" maxlength="6" required>
                </div>
                <div class="cnt-field">
                    <label for="evt-fee">참가비 (선택)</label>
                    <input type="text" id="evt-fee" maxlength="60">
                </div>
            </div>
            <div class="cnt-field">
                <label>대표 사진 (선택)</label>
                <div id="evt-hero-upload"></div>
            </div>
            <div class="cnt-field">
                <label for="evt-intro-title">소개 제목 (선택)</label>
                <input type="text" id="evt-intro-title" maxlength="120">
            </div>
            <div class="cnt-field">
                <label for="evt-intro-body">소개 문구 (선택)</label>
                <textarea id="evt-intro-body" rows="4"></textarea>
            </div>

            <div class="cnt-field">
                <label>차 정보 (선택)</label>
                <div class="evt-tea-list" id="evt-teas-list"></div>
                <button type="button" class="cnt-btn-secondary" id="evt-add-tea-btn">+ 차 추가</button>
            </div>

            <p class="cnt-form-error" id="evt-form-error" hidden></p>
            <div class="cnt-form-actions">
                <button type="button" class="cnt-btn-secondary" id="evt-cancel-btn">취소</button>
                <button type="submit" class="adm-btn" id="evt-save-btn">저장</button>
            </div>
        </form>
    </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   1. Tab switching
   ══════════════════════════════════════════════════════════════════════ */
(function () {
    const tabs   = document.querySelectorAll(".adm-tab");
    const panels = document.querySelectorAll(".adm-panel");

    tabs.forEach(tab => {
        tab.addEventListener("click", () => {
            const id = tab.dataset.panel;
            tabs.forEach(t => t.classList.toggle("is-active", t === tab));
            panels.forEach(p => p.classList.toggle("is-active", p.id === id));
            if (id === "tab-somori") window.__smActivate?.();
            if (id === "tab-notices") window.__ntcActivate?.();
            if (id === "tab-info") window.__infActivate?.();
            if (id === "tab-events") window.__evtActivate?.();
        });
    });
})();




/* ══════════════════════════════════════════════════════════════════════
   2. 소모임 viewer
   ══════════════════════════════════════════════════════════════════════ */
(function () {
    const JOIN_API = (typeof window.JOIN_APPS_SCRIPT_URL === "string" && window.JOIN_APPS_SCRIPT_URL.trim())
        ? window.JOIN_APPS_SCRIPT_URL.trim() : "";

    const statusEl     = document.getElementById("sm-status");
    const upcomingGrid = document.getElementById("sm-upcoming-grid");
    const pastGrid     = document.getElementById("sm-past-grid");
    const upcomingWrap = document.getElementById("sm-upcoming-wrap");
    const pastWrap     = document.getElementById("sm-past-wrap");
    const upcomingLbl  = document.getElementById("sm-upcoming-label");
    const refreshBtn   = document.getElementById("sm-refresh-btn");
    const showPastChk  = document.getElementById("sm-show-past");
    const lastUpdEl    = document.getElementById("sm-last-upd");

    const WEEKDAYS = ["일","월","화","수","목","금","토"];
    const pad2 = n => String(n).padStart(2,"0");

    function todayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    }
    function formatEventDate(dateStr, timeStr) {
        if (!dateStr) return "";
        const [y,m,d] = dateStr.split("-").map(Number);
        const wd = WEEKDAYS[new Date(y,m-1,d).getDay()];
        let s = `${y}년 ${m}월 ${d}일 (${wd})`;
        if (timeStr) {
            const [h,min] = timeStr.split(":").map(Number);
            s += ` ${h<12?"오전":"오후"} ${h%12||12}:${pad2(min)}`;
        }
        return s;
    }
    function setStatus(msg, isErr=false) {
        statusEl.textContent = msg;
        statusEl.className = "adm-status" + (isErr ? " err" : "");
    }

    // ── fetch ──────────────────────────────────────────────────────
    let loaded = false;

    async function loadAll() {
        if (!JOIN_API) {
            setStatus("소모임 API URL이 설정되지 않았습니다. (join-config.js 확인)", true);
            return;
        }
        setStatus("소모임 목록 불러오는 중…");
        refreshBtn.disabled = true;
        try {
            const res  = await fetch(JOIN_API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "list" }),
                cache: "no-store",
            });
            const data = await res.json();
            if (!data.ok) { setStatus(data.error || "오류가 발생했습니다.", true); return; }

            const events  = data.events  || [];
            const signups = data.signups || [];
            renderCards(events, signups);
            loaded = true;
            lastUpdEl.textContent = `최종 조회 ${new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`;
            setStatus(events.length ? `소모임 ${events.length}개 조회됨` : "등록된 소모임이 없습니다.");
        } catch (e) {
            setStatus("네트워크 오류가 발생했습니다.", true);
        } finally {
            refreshBtn.disabled = false;
        }
    }

    // ── render cards ───────────────────────────────────────────────
    function renderCards(events, signups) {
        upcomingGrid.innerHTML = pastGrid.innerHTML = "";
        const today = todayStr();
        const sorted = [...events].sort((a,b) => (a.date||"").localeCompare(b.date||"") || (a.time||"").localeCompare(b.time||""));

        const upcoming = sorted.filter(e => (e.date||"") >= today);
        const past     = sorted.filter(e => (e.date||"") <  today).reverse();

        // show/hide "예정 소모임" label only when there are also past ones
        upcomingLbl.hidden = past.length === 0;

        if (upcoming.length === 0 && past.length === 0) {
            const el = document.createElement("p");
            el.className = "adm-empty";
            el.textContent = "등록된 소모임이 없습니다.";
            upcomingGrid.appendChild(el);
        }

        upcoming.forEach(ev => upcomingGrid.appendChild(buildCard(ev, signups)));
        past.forEach(ev => pastGrid.appendChild(buildCard(ev, signups, true)));

        updatePastVisibility();
    }

    function updatePastVisibility() {
        pastWrap.hidden = !showPastChk.checked;
    }

    showPastChk.addEventListener("change", updatePastVisibility);

    // ── build one event card ───────────────────────────────────────
    function buildCard(ev, allSignups, isPast = false) {
        const eventSignups = allSignups.filter(s => s.eventId === ev.id);
        const cap = Number(ev.capacity) || 0;
        const cur = eventSignups.length;
        const full = cap > 0 && cur >= cap;
        const pct  = cap > 0 ? Math.min(100, cur / cap * 100) : 0;

        const card = document.createElement("div");
        card.className = "sm-card";
        if (isPast) card.style.opacity = ".72";

        // ── body ──
        const body = document.createElement("div");
        body.className = "sm-card-body";

        // date / time
        const dateEl = document.createElement("p");
        dateEl.className = "sm-card-date";
        dateEl.textContent = formatEventDate(ev.date, ev.time);
        body.appendChild(dateEl);

        // title
        const titleEl = document.createElement("p");
        titleEl.className = "sm-card-title";
        titleEl.textContent = ev.title || "(제목 없음)";
        body.appendChild(titleEl);

        // host
        const hostEl = document.createElement("p");
        hostEl.className = "sm-card-host";
        hostEl.textContent = `주최: ${ev.host || "—"}`;
        body.appendChild(hostEl);

        // ── admin approval banner ──
        // Shown while approved_at is still NULL. Clicking 승인하기 prompts
        // for the admin password (via window.prompt so the button works
        // without opening the detail panel below). On success we flip the
        // banner to a compact 승인 완료 stamp — no reload needed.
        if (!ev.approvedAt) {
            const pending = document.createElement("div");
            pending.className = "sm-pending-banner";
            const msg = document.createElement("span");
            msg.innerHTML = "<b>관리자 승인 대기 중</b> · 승인 전에는 주최자 외 신청이 불가합니다.";
            const approveBtn = document.createElement("button");
            approveBtn.className = "sm-approve-btn";
            approveBtn.type = "button";
            approveBtn.textContent = "승인하기";
            const err = document.createElement("p");
            err.className = "sm-approve-err"; err.hidden = true;

            approveBtn.addEventListener("click", async () => {
                const adminPassword = window.prompt("관리자 비밀번호를 입력해주세요.");
                if (adminPassword == null) return;               // cancelled
                if (!adminPassword.trim()) { err.textContent = "비밀번호를 입력해주세요."; err.hidden = false; return; }
                approveBtn.disabled = true; approveBtn.textContent = "승인 중…"; err.hidden = true;
                try {
                    const res = await fetch(JOIN_API, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: "approveEvent", id: ev.id, adminPassword: adminPassword.trim() }),
                        cache: "no-store",
                    });
                    const data = await res.json();
                    if (!data.ok) { err.textContent = data.error || "승인에 실패했습니다."; err.hidden = false; approveBtn.disabled = false; approveBtn.textContent = "승인하기"; return; }
                    // reflect the new state locally without a full refresh
                    ev.approvedAt = data.approvedAt || new Date().toISOString();
                    pending.innerHTML = "<span>✓ 승인 완료 · 이제 신청을 받을 수 있어요.</span>";
                    pending.style.background = "rgba(28, 102, 85, 0.08)";
                    pending.style.borderColor = "rgba(28, 102, 85, 0.28)";
                    pending.style.color = "#1c6655";
                } catch {
                    err.textContent = "네트워크 오류가 발생했습니다.";
                    err.hidden = false;
                    approveBtn.disabled = false;
                    approveBtn.textContent = "승인하기";
                }
            });

            pending.appendChild(msg);
            pending.appendChild(approveBtn);
            body.appendChild(pending);
            body.appendChild(err);
        }

        // capacity bar
        const capRow = document.createElement("div");
        capRow.className = "sm-cap-row";
        const trk = document.createElement("div"); trk.className = "sm-cap-track";
        const fil = document.createElement("div"); fil.className = "sm-cap-fill" + (full ? " is-full" : "");
        fil.style.width = `${pct}%`;
        trk.appendChild(fil);
        const cnt = document.createElement("span");
        cnt.className = "sm-cap-cnt" + (full ? " is-full" : "");
        cnt.textContent = cap > 0 ? `${cur}/${cap}명` : `${cur}명`;
        capRow.appendChild(trk);
        capRow.appendChild(cnt);
        if (full) {
            const pill = document.createElement("span"); pill.className = "sm-full-pill"; pill.textContent = "마감";
            capRow.appendChild(pill);
        }
        body.appendChild(capRow);

        // participant name chips
        const namesEl = document.createElement("div");
        namesEl.className = "sm-names";
        if (eventSignups.length === 0) {
            const emp = document.createElement("span"); emp.className = "sm-names-empty"; emp.textContent = "참가자 없음";
            namesEl.appendChild(emp);
        } else {
            eventSignups.forEach(s => {
                const isHost = s.id === ev.hostSignupId;
                const chip = document.createElement("span");
                chip.className = "sm-name-chip" + (isHost ? " is-host" : "");
                chip.textContent = s.name;
                if (isHost) { const m = document.createElement("span"); m.className="sm-host-mark"; m.textContent="주최"; chip.appendChild(m); }
                namesEl.appendChild(chip);
            });
        }
        body.appendChild(namesEl);

        card.appendChild(body);

        // ── detail toggle (real names) ──
        const toggleBtn = document.createElement("button");
        toggleBtn.className = "sm-detail-toggle";
        toggleBtn.innerHTML = `<span>실명 · 연락처 조회</span><span class="sm-detail-toggle-arrow">▾</span>`;

        const detailPanel = document.createElement("div");
        detailPanel.className = "sm-detail-panel";

        // password row
        const pwRow = document.createElement("div");
        pwRow.className = "sm-detail-pw-row";
        const pwInput = document.createElement("input");
        pwInput.type = "password"; pwInput.placeholder = "관리자 비밀번호";
        const lookupBtn = document.createElement("button");
        lookupBtn.className = "adm-btn-sm"; lookupBtn.textContent = "조회";
        pwRow.appendChild(pwInput); pwRow.appendChild(lookupBtn);

        const errEl = document.createElement("p");
        errEl.className = "sm-detail-err"; errEl.hidden = true;

        const tableWrapEl = document.createElement("div");
        tableWrapEl.className = "sm-detail-table-wrap";

        detailPanel.appendChild(pwRow);
        detailPanel.appendChild(errEl);
        detailPanel.appendChild(tableWrapEl);

        toggleBtn.addEventListener("click", () => {
            const open = !detailPanel.classList.contains("is-open");
            detailPanel.classList.toggle("is-open", open);
            toggleBtn.classList.toggle("is-open", open);
            if (open) setTimeout(() => pwInput.focus(), 50);
        });

        async function doLookup() {
            const adminPassword = pwInput.value.trim();
            if (!adminPassword) { errEl.textContent = "비밀번호를 입력해주세요."; errEl.hidden = false; return; }
            lookupBtn.disabled = true; lookupBtn.textContent = "조회 중…";
            errEl.hidden = true; tableWrapEl.innerHTML = "";
            try {
                const res  = await fetch(JOIN_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "eventParticipants", id: ev.id, adminPassword }),
                    cache: "no-store",
                });
                const data = await res.json();
                if (!data.ok) { errEl.textContent = data.error || "오류가 발생했습니다."; errEl.hidden = false; return; }
                renderParticipantTable(tableWrapEl, data.participants || []);
            } catch { errEl.textContent = "네트워크 오류가 발생했습니다."; errEl.hidden = false; }
            finally { lookupBtn.disabled = false; lookupBtn.textContent = "조회"; }
        }

        lookupBtn.addEventListener("click", doLookup);
        pwInput.addEventListener("keydown", e => { if (e.key === "Enter") doLookup(); });

        // ── admin delete ──
        const deleteRow = document.createElement("div");
        deleteRow.className = "sm-delete-row";
        const deleteBtn = document.createElement("button");
        deleteBtn.className = "adm-btn-danger";
        deleteBtn.textContent = "소모임 삭제";
        deleteRow.appendChild(deleteBtn);
        detailPanel.appendChild(deleteRow);

        deleteBtn.addEventListener("click", async () => {
            const adminPassword = pwInput.value.trim();
            if (!adminPassword) { errEl.textContent = "먼저 관리자 비밀번호를 입력해주세요."; errEl.hidden = false; pwInput.focus(); return; }
            if (!window.confirm(`"${ev.title}" 소모임을 삭제할까요?\n참가자가 있어도 강제 삭제됩니다. 되돌릴 수 없어요.`)) return;
            deleteBtn.disabled = true; deleteBtn.textContent = "삭제 중…";
            errEl.hidden = true;
            try {
                const res  = await fetch(JOIN_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "deleteEvent", id: ev.id, adminPassword }),
                    cache: "no-store",
                });
                const data = await res.json();
                if (!data.ok) { errEl.textContent = data.error || "삭제에 실패했습니다."; errEl.hidden = false; return; }
                card.remove();
                setStatus("소모임이 삭제되었습니다.");
            } catch { errEl.textContent = "네트워크 오류가 발생했습니다."; errEl.hidden = false; }
            finally { deleteBtn.disabled = false; deleteBtn.textContent = "소모임 삭제"; }
        });

        card.appendChild(toggleBtn);
        card.appendChild(detailPanel);
        return card;
    }

    function renderParticipantTable(wrap, participants) {
        if (!participants.length) {
            wrap.innerHTML = '<p style="font-size:12px;color:#aaa;padding:6px 0">참가자가 없습니다.</p>';
            return;
        }
        const fmtTs = iso => iso
            ? new Date(iso).toLocaleDateString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})
            : "—";

        const tbl = document.createElement("table");
        tbl.className = "sm-detail-table";
        const hdr = document.createElement("tr");
        ["#","닉네임","실명","연락처","신청 일시","취소 일시"].forEach(h => {
            const th = document.createElement("th"); th.textContent = h; hdr.appendChild(th);
        });
        tbl.appendChild(hdr);

        participants
            .sort((a,b) => new Date(a.createdAt||0) - new Date(b.createdAt||0))
            .forEach((p, i) => {
                const canceled = !!p.canceledAt;
                const tr = document.createElement("tr");
                if (canceled) tr.classList.add("is-canceled-row");
                else if (p.isHost) tr.classList.add("is-host-row");

                // nickname cell — host badge or cancel badge
                let nameCellHtml = p.name;
                if (p.isHost) nameCellHtml += ' <span class="sm-host-badge">주최</span>';
                if (canceled)  nameCellHtml += ' <span class="sm-cancel-badge">취소</span>';

                [i+1, nameCellHtml, p.realName||"—", p.contact||"—", fmtTs(p.createdAt), fmtTs(p.canceledAt)].forEach((v, vi) => {
                    const td = document.createElement("td");
                    if (vi === 1) td.innerHTML = v; else td.textContent = v;
                    tr.appendChild(td);
                });
                tbl.appendChild(tr);
            });
        wrap.appendChild(tbl);
    }

    // ── trigger on tab open ────────────────────────────────────────
    window.__smActivate = function () {
        if (!loaded) loadAll();
    };
    refreshBtn.addEventListener("click", loadAll);
})();


/* ══════════════════════════════════════════════════════════════════════
   4. 소모임 이력 (past events + full cancellation history, admin-only)
   ══════════════════════════════════════════════════════════════════════ */
(function () {
    const JOIN_API = (typeof window.JOIN_APPS_SCRIPT_URL === "string" && window.JOIN_APPS_SCRIPT_URL.trim())
        ? window.JOIN_APPS_SCRIPT_URL.trim() : "";

    const pwInput  = document.getElementById("hist-pw");
    const fetchBtn = document.getElementById("hist-fetch-btn");
    const statusEl = document.getElementById("hist-status");
    const listEl   = document.getElementById("hist-list");

    const WEEKDAYS = ["일","월","화","수","목","금","토"];
    const pad2 = n => String(n).padStart(2,"0");

    function todayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    }
    function formatEventDate(dateStr, timeStr) {
        if (!dateStr) return "";
        const [y,m,d] = dateStr.split("-").map(Number);
        const wd = WEEKDAYS[new Date(y,m-1,d).getDay()];
        let s = `${y}년 ${m}월 ${d}일 (${wd})`;
        if (timeStr) {
            const [h,min] = timeStr.split(":").map(Number);
            s += ` ${h<12?"오전":"오후"} ${h%12||12}:${pad2(min)}`;
        }
        return s;
    }
    function fmtTs(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    function setStatus(msg, isErr=false) {
        statusEl.textContent = msg;
        statusEl.className = "adm-status" + (isErr ? " err" : "");
    }

    async function loadHistory() {
        const adminPassword = pwInput.value.trim();
        if (!adminPassword) { setStatus("관리자 비밀번호를 입력해주세요.", true); return; }
        if (!JOIN_API) { setStatus("소모임 API URL이 설정되지 않았습니다. (join-config.js 확인)", true); return; }

        fetchBtn.disabled = true;
        listEl.innerHTML = "";
        setStatus("불러오는 중…");
        try {
            const res  = await fetch(JOIN_API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "adminListAll", adminPassword }),
                cache: "no-store",
            });
            const data = await res.json();
            if (!data.ok) { setStatus(data.error || "오류가 발생했습니다.", true); return; }

            const today = todayStr();
            // history = every past event PLUS every deleted event (regardless
            // of date). Deleted future-dated events belong here too since
            // there's nowhere else to see them after their calendar row is
            // gone from the public list.
            const histEvents = (data.events || [])
                .filter(e => e.deletedAt || (e.date || "") < today)
                .sort((a, b) => b.date.localeCompare(a.date) || (b.time||"").localeCompare(a.time||""));
            const allSignups = data.signups || [];

            if (histEvents.length === 0) {
                const p = document.createElement("p");
                p.className = "hist-no-events";
                p.textContent = "지난 소모임이 없습니다.";
                listEl.appendChild(p);
                setStatus("지난 소모임이 없습니다.");
                return;
            }

            const deletedCount = histEvents.filter(e => e.deletedAt).length;
            setStatus(deletedCount
                ? `지난 소모임 ${histEvents.length}개 (삭제된 소모임 ${deletedCount}개 포함)`
                : `지난 소모임 ${histEvents.length}개`);
            histEvents.forEach(ev => {
                const evSignups = allSignups.filter(s => s.eventId === ev.id);
                listEl.appendChild(buildHistCard(ev, evSignups));
            });
        } catch { setStatus("네트워크 오류가 발생했습니다.", true); }
        finally { fetchBtn.disabled = false; }
    }

    function buildHistCard(ev, signups) {
        const activeCount   = signups.filter(s => !s.canceledAt).length;
        const canceledCount = signups.filter(s =>  s.canceledAt).length;

        const card = document.createElement("div");
        card.className = "hist-event-card" + (ev.deletedAt ? " is-deleted" : "");

        // ── header ──
        const head = document.createElement("div");
        head.className = "hist-card-head";

        const dateEl = document.createElement("p");
        dateEl.className = "hist-card-date";
        dateEl.textContent = formatEventDate(ev.date, ev.time);
        head.appendChild(dateEl);

        const titleEl = document.createElement("p");
        titleEl.className = "hist-card-title";
        titleEl.textContent = ev.title || "(제목 없음)";
        head.appendChild(titleEl);

        const hostEl = document.createElement("p");
        hostEl.className = "hist-card-host";
        hostEl.textContent = `주최: ${ev.host || "—"}`;
        head.appendChild(hostEl);

        const chips = document.createElement("div");
        chips.className = "hist-card-chips";
        if (ev.deletedAt) {
            // stand-out red chip so a scan of the history immediately
            // separates deleted rows from just-past ones
            const del = document.createElement("span");
            del.className = "hist-chip deleted";
            del.textContent = `삭제됨 · ${formatEventDate(ev.deletedAt.slice(0,10))}`;
            chips.appendChild(del);
        }
        const activeChip = document.createElement("span");
        activeChip.className = "hist-chip";
        activeChip.textContent = `신청 ${activeCount}명`;
        chips.appendChild(activeChip);
        if (canceledCount > 0) {
            const cancelChip = document.createElement("span");
            cancelChip.className = "hist-chip canceled";
            cancelChip.textContent = `취소 ${canceledCount}명`;
            chips.appendChild(cancelChip);
        }
        head.appendChild(chips);
        card.appendChild(head);

        // ── participant table ──
        if (signups.length === 0) {
            const empty = document.createElement("p");
            empty.className = "hist-empty-card";
            empty.textContent = "신청자가 없습니다.";
            card.appendChild(empty);
            return card;
        }

        const tableWrap = document.createElement("div");
        tableWrap.className = "hist-table-wrap";
        const tbl = document.createElement("table");
        tbl.className = "hist-table";
        const hdr = document.createElement("tr");
        ["#","닉네임","실명","연락처","신청 일시","취소 일시"].forEach(h => {
            const th = document.createElement("th"); th.textContent = h; hdr.appendChild(th);
        });
        tbl.appendChild(hdr);

        signups
            .slice()
            .sort((a, b) => new Date(a.createdAt||0) - new Date(b.createdAt||0))
            .forEach((s, i) => {
                const canceled = !!s.canceledAt;
                const isHost   = s.id === ev.hostSignupId;
                const tr = document.createElement("tr");
                if (canceled) tr.classList.add("hist-row-canceled");
                else if (isHost) tr.classList.add("hist-row-host");

                let nameHtml = s.name || "—";
                if (isHost)   nameHtml += ' <span class="hist-badge-host">주최</span>';
                if (canceled) nameHtml += ' <span class="hist-badge-canceled">취소</span>';

                [i+1, nameHtml, s.realName||"—", s.contact||"—",
                 fmtTs(s.createdAt), fmtTs(s.canceledAt)].forEach((v, vi) => {
                    const td = document.createElement("td");
                    if (vi === 1) td.innerHTML = v; else td.textContent = v;
                    tr.appendChild(td);
                });
                tbl.appendChild(tr);
            });

        tableWrap.appendChild(tbl);
        card.appendChild(tableWrap);
        return card;
    }

    fetchBtn.addEventListener("click", loadHistory);
    pwInput.addEventListener("keydown", e => { if (e.key === "Enter") loadHistory(); });
})();

// ── admin lock overlay ─────────────────────────────────────────────────
// Password gate that stays up until adminListAll accepts the entered
// password. Successful unlock:
//   1. stashes the password in sessionStorage (per-tab; clears on close)
//   2. hides the overlay
//   3. pre-fills the two downstream password inputs (adm-pw, hist-pw) so
//      the user doesn't retype the same password for every tab
// A small "잠금" button in the header re-locks manually.
(function () {
    "use strict";
    const STORAGE_KEY = "snuTeaAdminPw_v1";
    const JOIN_API = (typeof window.JOIN_APPS_SCRIPT_URL === "string" && window.JOIN_APPS_SCRIPT_URL.trim())
        ? window.JOIN_APPS_SCRIPT_URL.trim() : "";

    const overlay  = document.getElementById("adm-lock");
    const form     = document.getElementById("adm-lock-form");
    const input    = document.getElementById("adm-lock-input");
    const btn      = document.getElementById("adm-lock-btn");
    const err      = document.getElementById("adm-lock-err");
    const relock   = document.getElementById("adm-relock-btn");
    const histPw   = document.getElementById("hist-pw");

    function showError(msg) {
        err.textContent = msg;
        input.classList.add("is-error");
        input.select();
    }
    function clearError() {
        err.textContent = "";
        input.classList.remove("is-error");
    }

    async function verify(password) {
        // adminListAll rejects a wrong password with { ok: false }, so this
        // doubles as our credential check without needing a new endpoint
        const res = await fetch(JOIN_API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "adminListAll", adminPassword: password }),
            cache: "no-store",
        });
        return await res.json();
    }

    function unlock(password) {
        try { sessionStorage.setItem(STORAGE_KEY, password); } catch (e) { /* private mode */ }
        // pre-fill the tab-level inputs so the user doesn't retype
        if (histPw && !histPw.value) histPw.value = password;
        overlay.hidden = true;
        relock.hidden = false;
        clearError();
    }
    function lock() {
        try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
        if (histPw) histPw.value = "";
        overlay.hidden = false;
        relock.hidden = true;
        input.value = "";
        setTimeout(() => input.focus(), 50);
    }

    // Initial state: if JOIN_API is missing there's no way to verify, so we
    // just show the gate with an explanatory error rather than opening it.
    if (!JOIN_API) {
        btn.disabled = true;
        showError("관리자 API가 설정되지 않았습니다. join-config.js 확인이 필요해요.");
        return;
    }

    // Try silent re-auth on load if we have a stashed password
    const stashed = (() => { try { return sessionStorage.getItem(STORAGE_KEY); } catch (e) { return null; } })();
    if (stashed) {
        btn.disabled = true;
        btn.textContent = "확인 중…";
        verify(stashed).then((data) => {
            if (data && data.ok) unlock(stashed);
            else {
                try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
                // stay locked without a message — user just needs to re-enter
            }
        }).catch(() => { /* stay locked, no noisy error on silent try */ })
          .finally(() => { btn.disabled = false; btn.textContent = "확인"; });
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const pw = input.value.trim();
        if (!pw) { showError("비밀번호를 입력해주세요."); return; }
        btn.disabled = true; btn.textContent = "확인 중…"; clearError();
        try {
            const data = await verify(pw);
            if (data && data.ok) unlock(pw);
            else showError(data && data.error ? data.error : "비밀번호가 올바르지 않습니다.");
        } catch {
            showError("네트워크 오류가 발생했습니다.");
        } finally {
            btn.disabled = false; btn.textContent = "확인";
        }
    });

    relock.addEventListener("click", lock);
})();
</script>

<script>
/* ══════════════════════════════════════════════════════════════════════
   6. 공지사항 / 정보 admin — one shared modal + grid renderer,
      parameterized per content type via wireContentAdmin(cfg).
   ══════════════════════════════════════════════════════════════════════ */
(function () {
    const STORAGE_KEY = "snuTeaAdminPw_v1"; // same key the password-lock IIFE above uses
    function adminPw() {
        try { return sessionStorage.getItem(STORAGE_KEY) || ""; } catch (e) { return ""; }
    }

    function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
    }
    function formatDateKo(iso) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
        return m ? `${Number(m[1])}년 ${Number(m[2])}월 ${Number(m[3])}일` : String(iso || "");
    }

    // ── shared modal (one DOM instance, retargeted per open() call) ──────
    const modalOverlay   = document.getElementById("cnt-modal-overlay");
    const modalTitle     = document.getElementById("cnt-modal-title");
    const form           = document.getElementById("cnt-form");
    const titleInput     = document.getElementById("cnt-title");
    const titleEnInput   = document.getElementById("cnt-title-en");
    const dateInput      = document.getElementById("cnt-date");
    const pinnedInput    = document.getElementById("cnt-pinned");
    const excerptInput   = document.getElementById("cnt-excerpt");
    const excerptEnInput = document.getElementById("cnt-excerpt-en");
    const formError      = document.getElementById("cnt-form-error");
    const saveBtn        = document.getElementById("cnt-save-btn");
    const cancelBtn      = document.getElementById("cnt-cancel-btn");
    const closeBtn       = document.getElementById("cnt-modal-close");

    const editorOptions = { getAdminPassword: adminPw };
    const bodyEditor   = RichEditor.create(document.getElementById("cnt-body-editor"), "", editorOptions);
    const bodyEditorEn = RichEditor.create(document.getElementById("cnt-body-editor-en"), "", editorOptions);

    let activeConfig = null; // which content type the modal is currently editing
    let editingId = null;    // null = creating a new one

    function openModal(cfg, item) {
        activeConfig = cfg;
        editingId = item ? item.id : null;
        modalTitle.textContent = item ? cfg.editTitle : cfg.newTitle;
        titleInput.value = item ? (item.title || "") : "";
        titleEnInput.value = item ? (item.titleEn || "") : "";
        dateInput.value = item ? (item.date || "") : new Date().toISOString().slice(0, 10);
        pinnedInput.checked = item ? !!item.pinned : false;
        excerptInput.value = item ? (item.excerpt || "") : "";
        excerptEnInput.value = item ? (item.excerptEn || "") : "";
        bodyEditor.setHTML(item ? (item.bodyHtml || "") : "");
        bodyEditorEn.setHTML(item ? (item.bodyHtmlEn || "") : "");
        formError.hidden = true;
        modalOverlay.classList.add("is-open");
        titleInput.focus();
    }
    function closeModal() {
        modalOverlay.classList.remove("is-open");
        activeConfig = null;
        editingId = null;
    }

    closeBtn.addEventListener("click", closeModal);
    cancelBtn.addEventListener("click", closeModal);
    modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeModal(); });
