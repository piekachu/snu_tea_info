    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modalOverlay.classList.contains("is-open")) closeModal();
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!activeConfig) return;

        const pw = adminPw();
        if (!pw) {
            formError.textContent = "관리자 비밀번호가 필요해요. 페이지 상단에서 잠금을 먼저 해제해주세요.";
            formError.hidden = false;
            return;
        }

        const fields = {
            title: titleInput.value.trim(),
            titleEn: titleEnInput.value.trim() || null,
            date: dateInput.value,
            excerpt: excerptInput.value.trim() || null,
            excerptEn: excerptEnInput.value.trim() || null,
            bodyHtml: bodyEditor.getHTML(),
            bodyHtmlEn: bodyEditorEn.getHTML() || null,
            pinned: pinnedInput.checked,
        };
        if (!fields.title || !fields.date) {
            formError.textContent = "제목과 날짜는 필수예요.";
            formError.hidden = false;
            return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = "저장 중…";
        try {
            const res = editingId
                ? await activeConfig.update(editingId, fields, pw)
                : await activeConfig.create(fields, pw);
            if (!res.ok) {
                formError.textContent = res.error || "저장하지 못했어요.";
                formError.hidden = false;
                return;
            }
            const cfg = activeConfig;
            closeModal();
            cfg.refresh && cfg.refresh();
        } catch (err) {
            formError.textContent = "네트워크 오류가 발생했어요.";
            formError.hidden = false;
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = "저장";
        }
    });

    // ── per-content-type grid + list wiring ───────────────────────────
    function wireContentAdmin(cfg) {
        const grid = document.getElementById(cfg.gridId);
        const status = document.getElementById(cfg.statusId);
        const refreshBtn = document.getElementById(cfg.refreshBtnId);
        const newBtn = document.getElementById(cfg.newBtnId);

        function setStatus(text, isErr) {
            status.textContent = text || "";
            status.classList.toggle("err", !!isErr);
        }

        function renderCard(item) {
            const card = el("div", "cnt-card");
            const top = el("div", "cnt-card-top");
            top.appendChild(el("span", "cnt-card-date", formatDateKo(item.date)));
            if (item.pinned) top.appendChild(el("span", "cnt-pin-badge", "고정"));
            card.appendChild(top);
            card.appendChild(el("h4", "cnt-card-title", item.title));
            if (item.excerpt) card.appendChild(el("p", "cnt-card-excerpt", item.excerpt));

            const actions = el("div", "cnt-card-actions");
            const editBtn = el("button", "adm-btn-sm", "수정");
            editBtn.type = "button";
            editBtn.addEventListener("click", () => openModal(cfg, item));
            actions.appendChild(editBtn);

            const delBtn = el("button", "adm-btn-danger", "삭제");
            delBtn.type = "button";
            delBtn.addEventListener("click", async () => {
                if (!window.confirm(`"${item.title}"을(를) 삭제할까요? 되돌릴 수 없어요.`)) return;
                const pw = adminPw();
                if (!pw) { setStatus("관리자 비밀번호가 필요해요.", true); return; }
                const res = await cfg.delete(item.id, pw);
                if (!res.ok) { setStatus(res.error || "삭제하지 못했어요.", true); return; }
                fetchList();
            });
            actions.appendChild(delBtn);
            card.appendChild(actions);
            return card;
        }

        async function fetchList() {
            const pw = adminPw();
            setStatus("불러오는 중…");
            const res = await cfg.list(pw);
            if (!res.ok) { setStatus(res.error || "불러오지 못했어요.", true); return; }
            // list*/list-with-adminPassword also returns soft-deleted rows
            // (deletedAt set) so the events-history view can show them —
            // this grid isn't a trash bin, so drop them here.
            const items = cfg.items(res).filter((item) => !item.deletedAt);
            grid.innerHTML = "";
            if (items.length === 0) {
                setStatus("등록된 글이 없어요.");
                return;
            }
            setStatus(`${items.length}개`);
            items.forEach((item) => grid.appendChild(renderCard(item)));
        }

        cfg.refresh = fetchList;

        refreshBtn.addEventListener("click", fetchList);
        newBtn.addEventListener("click", () => openModal(cfg, null));

        window[cfg.activateGlobal] = fetchList;
    }

    wireContentAdmin({
        gridId: "ntc-grid", statusId: "ntc-status",
        refreshBtnId: "ntc-refresh-btn", newBtnId: "ntc-new-btn",
        newTitle: "새 공지 작성", editTitle: "공지 수정",
        activateGlobal: "__ntcActivate",
        items: (res) => res.notices || [],
        list:   (pw) => ContentAPI.listNotices(pw),
        create: (fields, pw) => ContentAPI.createNotice(fields, pw),
        update: (id, fields, pw) => ContentAPI.updateNotice(id, fields, pw),
        delete: (id, pw) => ContentAPI.deleteNotice(id, pw),
    });

    wireContentAdmin({
        gridId: "inf-grid", statusId: "inf-status",
        refreshBtnId: "inf-refresh-btn", newBtnId: "inf-new-btn",
        newTitle: "새 정보 글 작성", editTitle: "정보 글 수정",
        activateGlobal: "__infActivate",
        items: (res) => res.info || [],
        list:   (pw) => ContentAPI.listInfo(pw),
        create: (fields, pw) => ContentAPI.createInfo(fields, pw),
        update: (id, fields, pw) => ContentAPI.updateInfo(id, fields, pw),
        delete: (id, pw) => ContentAPI.deleteInfo(id, pw),
    });
})();
</script>

<script>
/* ══════════════════════════════════════════════════════════════════════
   7. 정기다회 admin — its own grid + modal (not wireContentAdmin(): the
      field shape is different enough — location/coords/hero photo/a
      repeatable tea list — that sharing the notices/info modal would mean
      branching most of it anyway.
   ══════════════════════════════════════════════════════════════════════ */
(function () {
    const STORAGE_KEY = "snuTeaAdminPw_v1"; // same key the password-lock IIFE uses
    function adminPw() {
        try { return sessionStorage.getItem(STORAGE_KEY) || ""; } catch (e) { return ""; }
    }
    function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
    }
    function formatDateKo(iso) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
        return m ? `${Number(m[1])}년 ${Number(m[2])}월 ${Number(m[3])}일` : String(iso || "");
    }
    function labeled(labelText, inputEl) {
        const field = el("div", "cnt-field");
        field.appendChild(el("label", "", labelText));
        field.appendChild(inputEl);
        return field;
    }

    // small reusable "photo → upload button → thumbnail" control, used for
    // both the event's hero photo and each tea's photo
    function makeImageUpload(initialUrl) {
        const wrap = el("div", "evt-img-upload");
        const thumb = document.createElement("img");
        thumb.className = "evt-img-thumb";
        thumb.hidden = !initialUrl;
        if (initialUrl) thumb.src = initialUrl;
        const pickBtn = el("button", "cnt-btn-secondary", "사진 선택");
        pickBtn.type = "button";
        const clearBtn = el("button", "cnt-btn-secondary", "제거");
        clearBtn.type = "button";
        clearBtn.hidden = !initialUrl;
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.style.display = "none";

        let url = initialUrl || null;

        pickBtn.addEventListener("click", () => input.click());
        input.addEventListener("change", async () => {
            const file = input.files && input.files[0];
            if (!file) return;
            const pw = adminPw();
            if (!pw) { window.alert("관리자 비밀번호가 필요해요. 페이지 상단에서 잠금을 먼저 해제해주세요."); return; }
            pickBtn.disabled = true;
            pickBtn.textContent = "업로드 중…";
            try {
                const res = await ContentAPI.uploadImage(file, pw);
                if (!res.ok) { window.alert(res.error || "이미지를 업로드하지 못했어요."); return; }
                url = res.url;
                thumb.src = url;
                thumb.hidden = false;
                clearBtn.hidden = false;
            } catch (e) {
                window.alert("이미지를 업로드하지 못했어요.");
            } finally {
                pickBtn.disabled = false;
                pickBtn.textContent = "사진 선택";
                input.value = "";
            }
        });
        clearBtn.addEventListener("click", () => {
            url = null;
            thumb.hidden = true;
            thumb.src = "";
            clearBtn.hidden = true;
        });

        wrap.appendChild(thumb);
        wrap.appendChild(pickBtn);
        wrap.appendChild(clearBtn);
        wrap.appendChild(input);
        return { el: wrap, getUrl: () => url, reset: (u) => { url = u || null; thumb.src = url || ""; thumb.hidden = !url; clearBtn.hidden = !url; } };
    }

    // ── grid ───────────────────────────────────────────────────────────
    const grid = document.getElementById("evt-grid");
    const status = document.getElementById("evt-status");
    const refreshBtn = document.getElementById("evt-refresh-btn");
    const newBtn = document.getElementById("evt-new-btn");

    function setStatus(text, isErr) {
        status.textContent = text || "";
        status.classList.toggle("err", !!isErr);
    }

    function renderCard(item) {
        const card = el("div", "cnt-card");
        const top = el("div", "cnt-card-top");
        top.appendChild(el("span", "cnt-card-date", formatDateKo(item.date)));
        top.appendChild(el("span", "cnt-pin-badge", item.category === "specialTea" ? "특별다회" : "정기다회"));
        card.appendChild(top);
        card.appendChild(el("h4", "cnt-card-title", item.title));
        if (item.venueName) card.appendChild(el("p", "cnt-card-excerpt", item.venueName));

        const actions = el("div", "cnt-card-actions");
        const editBtn = el("button", "adm-btn-sm", "수정");
        editBtn.type = "button";
        editBtn.addEventListener("click", () => openModal(item));
        actions.appendChild(editBtn);

        const delBtn = el("button", "adm-btn-danger", "삭제");
        delBtn.type = "button";
        delBtn.addEventListener("click", async () => {
            if (!window.confirm(`"${item.title}"을(를) 삭제할까요? 되돌릴 수 없어요.`)) return;
            const pw = adminPw();
            if (!pw) { setStatus("관리자 비밀번호가 필요해요.", true); return; }
            const res = await ContentAPI.deleteEvent(item.id, pw);
            if (!res.ok) { setStatus(res.error || "삭제하지 못했어요.", true); return; }
            fetchList();
        });
        actions.appendChild(delBtn);
        card.appendChild(actions);
        return card;
    }

    async function fetchList() {
        const pw = adminPw();
        setStatus("불러오는 중…");
        const res = await ContentAPI.listEvents(pw);
        if (!res.ok) { setStatus(res.error || "불러오지 못했어요.", true); return; }
        // list-with-adminPassword also returns soft-deleted rows — see the
        // same fix applied to wireContentAdmin's fetchList() above
        const items = (res.events || []).filter((item) => !item.deletedAt);
        grid.innerHTML = "";
        if (items.length === 0) {
            setStatus("등록된 다회가 없어요.");
            return;
        }
        setStatus(`${items.length}개`);
        items.forEach((item) => grid.appendChild(renderCard(item)));
    }

    refreshBtn.addEventListener("click", fetchList);
    newBtn.addEventListener("click", () => openModal(null));
    window.__evtActivate = fetchList;

    // ── modal ──────────────────────────────────────────────────────────
    const modalOverlay   = document.getElementById("evt-modal-overlay");
    const modalTitle     = document.getElementById("evt-modal-title");
    const form            = document.getElementById("evt-form");
    const titleInput      = document.getElementById("evt-title");
    const titleEnInput    = document.getElementById("evt-title-en");
    const dateInput        = document.getElementById("evt-date");
    const timeInput        = document.getElementById("evt-time");
    const categorySelect  = document.getElementById("evt-category");
    const venueNameInput  = document.getElementById("evt-venue-name");
    const locationInput   = document.getElementById("evt-location");
    const mapLinkInput    = document.getElementById("evt-map-link");
    const geoStatusEl      = document.getElementById("evt-geo-status");
    const latInput         = document.getElementById("evt-lat");
    const lngInput         = document.getElementById("evt-lng");
    const capacityInput   = document.getElementById("evt-capacity");
    const feeInput         = document.getElementById("evt-fee");
    const heroUploadHost  = document.getElementById("evt-hero-upload");
    const introTitleInput = document.getElementById("evt-intro-title");
    const introBodyInput  = document.getElementById("evt-intro-body");
    const teasList         = document.getElementById("evt-teas-list");
    const addTeaBtn        = document.getElementById("evt-add-tea-btn");
    const formError        = document.getElementById("evt-form-error");
    const saveBtn           = document.getElementById("evt-save-btn");
    const cancelBtn        = document.getElementById("evt-cancel-btn");
    const closeBtn          = document.getElementById("evt-modal-close");

    // ── auto-geocode 장소 → 위도/경도 ──
    // Uses the same NAVER Cloud Platform Maps key as events-map.js
    // (domain-whitelisted — only authenticates on the deployed
    // https://piekachu.github.io origin, never on a local preview or
    // file://; see the "Naver geocoding workflow" project note). Runs when
    // 장소 loses focus, so admins never have to look up coordinates by hand
    // — lat/lng stay editable afterwards in case a lookup is wrong or the
    // admin wants to nudge the pin.
    const NCP_KEY_ID = "7x2r5r252m";
    function loadGeocoder() {
        return new Promise((resolve) => {
            if (window.naver && window.naver.maps && window.naver.maps.Service) { resolve(true); return; }
            window.__evtGeoReady = () => setTimeout(() => resolve(true), 0);
            const s = document.createElement("script");
            s.src = "https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=" + NCP_KEY_ID + "&submodules=geocoder&callback=__evtGeoReady";
            s.onerror = () => resolve(false);
            document.head.appendChild(s);
        });
    }
    function setGeoStatus(text, cls) {
        geoStatusEl.textContent = text;
        geoStatusEl.hidden = !text;
        geoStatusEl.classList.toggle("is-ok", cls === "ok");
        geoStatusEl.classList.toggle("is-err", cls === "err");
    }
    async function geocodeLocation() {
        const address = locationInput.value.trim();
        // a bare map URL (some existing entries use this instead of a real
        // address) can't be geocoded — leave lat/lng for manual entry
        if (!address || /^https?:\/\//.test(address)) return;
        setGeoStatus("좌표를 찾는 중…", null);
        const ready = await loadGeocoder();
        if (!ready || !window.naver || !naver.maps || !naver.maps.Service) {
            setGeoStatus("좌표를 자동으로 찾지 못했어요 — 실제 배포된 사이트(github.io)에서만 동작해요. 직접 입력해주세요.", "err");
            return;
        }
        naver.maps.Service.geocode({ query: address }, (status, response) => {
            if (status !== naver.maps.Service.Status.OK || !response?.v2?.addresses?.length) {
                setGeoStatus("주소로 좌표를 찾지 못했어요. 직접 입력해주세요.", "err");
                return;
            }
            const first = response.v2.addresses[0];
            latInput.value = first.y;
            lngInput.value = first.x;
            setGeoStatus(`좌표를 찾았어요: ${first.y}, ${first.x}`, "ok");
        });
    }
    locationInput.addEventListener("blur", geocodeLocation);

    // six-axis flavor profile, shown as a hexagon/radar chart on the public
    // page (events/view.html's renderFlavorChart) — kept in sync with the
    // key order there. 0–5 scale, all optional; a tea with none of these
    // filled in just skips the chart on the public page.
    const FLAVOR_AXES = [
        ["sweetness", "Sweetness"],
        ["bitterness", "Bitterness"],
        ["umami", "Umami"],
        ["astringency", "Astringency"],
        ["aroma", "Aroma"],
        ["body", "Body"],
    ];

    let editingId = null;
    let heroUpload = makeImageUpload(null);
    heroUploadHost.appendChild(heroUpload.el);

    let teaEntries = [];

    function renumberTeas() {
        teaEntries.forEach((t, i) => t.setNum(i + 1));
    }

    function createTeaCard(data) {
        data = data || {};
        const card = el("div", "evt-tea-card");
        const head = el("div", "evt-tea-card-head");
        const numLabel = el("span", "evt-tea-num", "");
        head.appendChild(numLabel);
        const rmBtn = el("button", "cnt-btn-secondary", "삭제");
        rmBtn.type = "button";
        head.appendChild(rmBtn);
        card.appendChild(head);

        const nameInput = document.createElement("input");
        nameInput.type = "text"; nameInput.maxLength = 60; nameInput.value = data.name || "";
        nameInput.placeholder = "예: 어린잎 잭살차";
        card.appendChild(labeled("차 이름 *", nameInput));

        const subtitleInput = document.createElement("input");
        subtitleInput.type = "text"; subtitleInput.maxLength = 80; subtitleInput.value = data.subtitle || "";
        card.appendChild(labeled("한 줄 설명 (선택)", subtitleInput));

        const photoField = el("div", "cnt-field");
        photoField.appendChild(el("label", "", "사진 (선택)"));
        const photoUpload = makeImageUpload(data.photoUrl || null);
        photoField.appendChild(photoUpload.el);
        card.appendChild(photoField);

        const descInput = document.createElement("textarea");
        descInput.rows = 3; descInput.value = data.description || "";
        card.appendChild(labeled("소개 (선택)", descInput));

        const brewRow = el("div", "cnt-field-row-3");
        const tempInput = document.createElement("input"); tempInput.type = "text"; tempInput.maxLength = 20; tempInput.placeholder = "95°C"; tempInput.value = data.brewTemp || "";
        const volInput  = document.createElement("input"); volInput.type = "text"; volInput.maxLength = 20; volInput.placeholder = "150ml"; volInput.value = data.brewVolume || "";
        const timeInput2 = document.createElement("input"); timeInput2.type = "text"; timeInput2.maxLength = 20; timeInput2.placeholder = "30초"; timeInput2.value = data.brewTime || "";
        brewRow.appendChild(labeled("온도", tempInput));
        brewRow.appendChild(labeled("물양", volInput));
        brewRow.appendChild(labeled("시간", timeInput2));
        card.appendChild(brewRow);

        const noteInput = document.createElement("textarea");
        noteInput.rows = 2; noteInput.value = data.brewNote || "";
        card.appendChild(labeled("우림법 설명 (선택)", noteInput));

        const flavorField = el("div", "cnt-field");
        flavorField.appendChild(el("label", "", "맛 프로필 (선택, 0~5)"));
        const flavorGrid = el("div", "evt-flavor-grid");
        const flavorInputs = {};
        FLAVOR_AXES.forEach(([key, label]) => {
            const item = el("div", "evt-flavor-item");
            item.appendChild(el("label", "", label));
            const input = document.createElement("input");
            input.type = "number"; input.min = "0"; input.max = "5"; input.step = "1";
            input.value = (data.flavor && data.flavor[key] != null) ? data.flavor[key] : "";
            item.appendChild(input);
            flavorGrid.appendChild(item);
            flavorInputs[key] = input;
        });
        flavorField.appendChild(flavorGrid);
        card.appendChild(flavorField);

        const entry = {
            el: card,
            setNum(n) { numLabel.textContent = "차 " + n; },
            getData() {
                const flavor = {};
                let hasFlavor = false;
                FLAVOR_AXES.forEach(([key]) => {
                    const raw = flavorInputs[key].value.trim();
                    if (raw === "") return;
                    const n = Number(raw);
                    if (!Number.isFinite(n)) return;
                    flavor[key] = Math.max(0, Math.min(5, Math.round(n)));
                    hasFlavor = true;
                });
                return {
                    name: nameInput.value.trim(),
                    subtitle: subtitleInput.value.trim() || undefined,
                    photoUrl: photoUpload.getUrl() || undefined,
                    description: descInput.value.trim() || undefined,
                    brewTemp: tempInput.value.trim() || undefined,
                    brewVolume: volInput.value.trim() || undefined,
                    brewTime: timeInput2.value.trim() || undefined,
                    brewNote: noteInput.value.trim() || undefined,
                    flavor: hasFlavor ? flavor : undefined,
                };
            },
        };
        rmBtn.addEventListener("click", () => {
            card.remove();
            teaEntries = teaEntries.filter((t) => t !== entry);
            renumberTeas();
        });
        return entry;
    }

    function addTea(data) {
        const entry = createTeaCard(data);
        teaEntries.push(entry);
        teasList.appendChild(entry.el);
        renumberTeas();
    }
    addTeaBtn.addEventListener("click", () => addTea(null));

    function showError(msg) {
        formError.textContent = msg;
        formError.hidden = false;
    }

    function openModal(item) {
        editingId = item ? item.id : null;
        modalTitle.textContent = item ? "다회 수정" : "새 다회 작성";
        titleInput.value = item ? (item.title || "") : "";
        titleEnInput.value = item ? (item.titleEn || "") : "";
        dateInput.value = item ? (item.date || "") : new Date().toISOString().slice(0, 10);
        timeInput.value = item ? (item.time || "") : "";
        categorySelect.value = item && item.category === "specialTea" ? "specialTea" : "regulars";
        venueNameInput.value = item ? (item.venueName || "") : "";
        locationInput.value = item ? (item.location || "") : "";
        mapLinkInput.value = item ? (item.mapLink || "") : "";
        latInput.value = item && item.lat != null ? item.lat : "";
        lngInput.value = item && item.lng != null ? item.lng : "";
        capacityInput.value = item && item.capacity != null ? item.capacity : "";
        feeInput.value = item ? (item.fee || "") : "";
        heroUpload.reset(item ? item.heroImageUrl : null);
        introTitleInput.value = item ? (item.introTitle || "") : "";
        introBodyInput.value = item ? (item.introBody || "") : "";
        setGeoStatus("", null);

        teasList.innerHTML = "";
        teaEntries = [];
        (item && Array.isArray(item.teas) ? item.teas : []).forEach((t) => addTea(t));

        formError.hidden = true;
        modalOverlay.classList.add("is-open");
        titleInput.focus();
    }
    function closeModal() {
        modalOverlay.classList.remove("is-open");
        editingId = null;
    }

    closeBtn.addEventListener("click", closeModal);
    cancelBtn.addEventListener("click", closeModal);
    modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeModal(); });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modalOverlay.classList.contains("is-open")) closeModal();
    });

    // parses a text input as a finite number, or null if blank/invalid
    function numOrNull(input) {
        const v = input.value.trim();
        if (!v) return null;
        const n = Number(v);
        return Number.isFinite(n) ? n : null;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const pw = adminPw();
        if (!pw) {
            showError("관리자 비밀번호가 필요해요. 페이지 상단에서 잠금을 먼저 해제해주세요.");
            return;
        }

        const title = titleInput.value.trim();
        const date = dateInput.value;
        const time = timeInput.value.trim();
        const venueName = venueNameInput.value.trim();
        const capacity = numOrNull(capacityInput);
        if (!title || !date || !time || !venueName || capacity == null) {
            showError("제목, 날짜, 시간, 장소 이름, 인원은 필수예요.");
            return;
        }

        const fields = {
            title,
            titleEn: titleEnInput.value.trim() || null,
            date,
            time,
            category: categorySelect.value === "specialTea" ? "specialTea" : "regulars",
            venueName,
            location: locationInput.value.trim() || null,
            mapLink: mapLinkInput.value.trim() || null,
            lat: numOrNull(latInput),
            lng: numOrNull(lngInput),
            fee: feeInput.value.trim() || null,
            capacity,
            heroImageUrl: heroUpload.getUrl() || null,
            introTitle: introTitleInput.value.trim() || null,
            introBody: introBodyInput.value.trim() || null,
            teas: teaEntries.map((t) => t.getData()).filter((t) => t.name),
        };

        saveBtn.disabled = true;
        saveBtn.textContent = "저장 중…";
        try {
            const res = editingId
                ? await ContentAPI.updateEvent(editingId, fields, pw)
                : await ContentAPI.createEvent(fields, pw);
            if (!res.ok) {
                showError(res.error || "저장하지 못했어요.");
                return;
            }
            closeModal();
            fetchList();
        } catch (err) {
            showError("네트워크 오류가 발생했어요.");
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = "저장";
        }
    });
})();
</script>
</body>
</html>
