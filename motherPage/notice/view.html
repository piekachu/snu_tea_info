<!DOCTYPE html>
<html lang="ko">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="HandheldFriendly" content="true">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">

    <!--fonts-->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

    <!--공통 css-->
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="notice.css">
    <script src="../i18n.js"></script>
    <script src="../content-config.js"></script>
    <script src="../content-api.js"></script>

    <title id="pageTitle" data-i18n="notice.pageTitle">공지사항</title>

</head>
<body class="page-home">

    <!-- header wide -->
    <header class="header">
        <div class="layout_full header_inner">
            <h1 class="header_logo">
                <a href="../index.html"><img src="../main_images/0001.png" width="154" height="23" alt="오설록" class="logo_img"></a>
            </h1>
        </div>
    </header>

    <main id="container" class="home">
        <div class="layout_max">

            <!-- Page Title -->
            <div class="section_header">
                <h2 class="title" id="detailTitle">&nbsp;</h2>
            </div>

            <div class="notice_detail">
                <div class="notice_detail_meta">
                    <a class="notice_detail_back" href="index.html"><span data-i18n="nav.backToNotice">&larr; 목록으로</span></a>
                    <span class="notice_detail_date" id="detailDate"></span>
                </div>

                <p id="detailLoading" data-i18n="common.loading">불러오는 중...</p>
                <p id="detailError" hidden data-i18n="notice.loadError">글을 불러오지 못했어요. 링크를 다시 확인해주세요.</p>

                <!-- admin-authored HTML, rendered as-is (trusted content — only
                     club officers can write it, gated by the admin password) -->
                <div class="ot_body" id="detailBody" hidden></div>
            </div>

        </div>
    </main>

    <!-- footer -->
    <footer class="footer">
        <div class="layout_max footer_inner">
            <div class="footer_about">
                <h2 class="footer_brand" data-i18n="footer.brand">설다연</h2>
                <p class="footer_desc" data-i18n="footer.desc">서울대학교 중앙 차동아리 설다연에 오신 것을 환영합니다!</p>
            </div>
            <div class="footer_contact">
                <a class="footer_link" href="https://www.instagram.com/snu_dado/" target="_blank" rel="noopener noreferrer">
                    <span class="footer_icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/></svg>
                    </span>
                    <span>@snu_dado</span>
                </a>
                <p class="footer_note" data-i18n="footer.instagramNote">문의사항은 인스타그램 DM으로 편하게 연락주세요!</p>
            </div>
        </div>
        <div class="footer_bottom">
            <p data-i18n="footer.rights">&copy; 2026 설다연. All rights reserved.</p>
        </div>
    </footer>

    <script>
    (function () {
        "use strict";

        const id = new URLSearchParams(window.location.search).get("id");

        const titleEl   = document.getElementById("detailTitle");
        const pageTitle = document.getElementById("pageTitle");
        const dateEl    = document.getElementById("detailDate");
        const loadingEl = document.getElementById("detailLoading");
        const errorEl   = document.getElementById("detailError");
        const bodyEl    = document.getElementById("detailBody");

        let notice = null;

        function formatDateKo(iso) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
            if (!m) return String(iso || "");
            return I18N.formatDate(Number(m[1]), Number(m[2]), Number(m[3]));
        }

        // re-render whenever the language toggles, same pattern as every
        // other dynamically-rendered page on the site
        function render() {
            if (!notice) return;
            const title = I18N.pick(notice, "title");
            titleEl.textContent = title;
            pageTitle.textContent = title;
            dateEl.textContent = formatDateKo(notice.date);
            const html = (I18N.lang === "en" && notice.bodyHtmlEn) ? notice.bodyHtmlEn : notice.bodyHtml;
            bodyEl.innerHTML = html || "";
        }

        async function init() {
            if (!id) {
                loadingEl.hidden = true;
                errorEl.hidden = false;
                return;
            }
            const res = await ContentAPI.getNotice(id);
            if (!res.ok || !res.notice) {
                loadingEl.hidden = true;
                errorEl.hidden = false;
                return;
            }
            notice = res.notice;
            loadingEl.hidden = true;
            bodyEl.hidden = false;
            render();
        }

        window.addEventListener("i18n:changed", render);
        init();
    })();
    </script>

</body>
</html>
