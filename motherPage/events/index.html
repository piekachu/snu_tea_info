<!DOCTYPE html>
<html lang="ko">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="HandheldFriendly" content="true">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">


    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">

    <!--fonts-->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

    <!--공통 css-->
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="carousel.css">
    <link rel="stylesheet" href="calendar.css">
    <script src="../i18n.js"></script>

    <title>Events</title>

</head>
<body class="page-home">

    <!-- header wide -->
    <header class="header">
        <div class="layout_full header_inner">
            <h1 class="header_logo">
                <a href="../index.html"><img src="../main_images/0001.png" width="154" height="23" alt="오설록" class="logo_img"></a>
            </h1>
        </div>
    </header>

    <main id="container" class="home">
        <div class="layout_max">

            <!-- Page Title -->
            <div class="section_header">
                <h2 class="title">Events</h2>
            </div>

            <section class="event_carousel" id="eventCarousel" data-path-prefix="../" aria-label="다가오는 행사">
                <div class="carousel_header">
                    <h3 class="carousel_title" data-i18n="carousel.upcomingEvents">다가오는 행사</h3>
                    <div class="carousel_controls">
                        <div class="carousel_filter">
                            <button type="button" id="filterToggle" class="filter_toggle" aria-haspopup="listbox" aria-expanded="false">
                                <span id="filterToggleLabel" data-i18n="common.all">전체</span>
                                <svg class="filter_toggle_icon" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <ul id="filterMenu" class="filter_menu" role="listbox" hidden></ul>
                        </div>
                        <button type="button" id="carouselPrev" class="carousel_nav" aria-label="이전" data-i18n-attr="aria-label:a11y.prev">&#8249;</button>
                        <button type="button" id="carouselNext" class="carousel_nav" aria-label="다음" data-i18n-attr="aria-label:a11y.next">&#8250;</button>
                    </div>
                </div>
                <div class="carousel_track" id="carouselTrack"></div>
            </section>

            <section class="calendar" aria-label="다과회 일정" data-i18n-attr="aria-label:events.calendarAria">
                <div class="calendar_header">
                    <button type="button" id="calPrev" class="calendar_nav" aria-label="이전 달" data-i18n-attr="aria-label:a11y.prevMonth">&#8249;</button>
                    <div class="calendar_titlewrap">
                        <h3 id="calLabel" class="calendar_label"></h3>
                        <button type="button" id="calToday" class="calendar_today" data-i18n="common.today">오늘</button>
                    </div>
                    <button type="button" id="calNext" class="calendar_nav" aria-label="다음 달" data-i18n-attr="aria-label:a11y.nextMonth">&#8250;</button>
                </div>
                <div class="calendar_weekdays" id="calWeekdays"></div>
                <div class="calendar_grid" id="calGrid"></div>
            </section>

        </div>
    </main>

    <script src="../content-config.js"></script>
    <script src="../content-api.js"></script>
    <script src="events-data.js"></script>
    <script src="events-carousel.js"></script>
    <script src="calendar.js"></script>

    <!-- footer -->
    <footer class="footer">
        <div class="layout_max footer_inner">
            <div class="footer_about">
                <h2 class="footer_brand" data-i18n="footer.brand">설다연</h2>
                <p class="footer_desc" data-i18n="footer.desc">서울대학교 중앙 차동아리 설다연에 오신 것을 환영합니다!</p>
            </div>
            <div class="footer_contact">
                <a class="footer_link" href="https://www.instagram.com/snu_dado/" target="_blank" rel="noopener noreferrer">
                    <span class="footer_icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/></svg>
                    </span>
                    <span>@snu_dado</span>
                </a>
                <p class="footer_note" data-i18n="footer.instagramNote">문의사항은 인스타그램 DM으로 편하게 연락주세요!</p>
            </div>
        </div>
        <div class="footer_bottom">
            <p data-i18n="footer.rights">&copy; 2026 설다연. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
